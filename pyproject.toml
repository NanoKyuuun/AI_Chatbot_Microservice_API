[project]
name = "ai-chatbot-microservice-api"
version = "0.1.0"
description = "AI Chatbot Microservice API for Document Q&A and Search"
authors = [
    { name = "NanoKyuuun" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.1",
    "pydantic[email]>=2.7.4",
    "pydantic-settings>=2.3.3",
    "sqlalchemy[asyncio]>=2.0.31",
    "asyncmy>=0.2.9",
    "alembic>=1.13.1",
    "redis>=5.0.6",
    "celery>=5.4.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "structlog>=24.2.0",
    "python-dotenv>=1.0.1",
    "PyMuPDF>=1.24.5",
    "python-docx>=1.1.2",
    "openpyxl>=3.1.4",
    "pandas>=2.2.2",
    "beautifulsoup4>=4.12.3",
    "markdown>=3.6",
    "tiktoken>=0.7.0",
    "qdrant-client>=1.9.1",
]

[project.optional-dependencies]
test = [
    "pytest>=8.2.2",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
